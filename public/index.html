<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HZZ 聊天室</title>
<meta name="theme-color" content="#f5f4fb">
<link rel="icon" href="data:,">
<script src="/theme.js?v=10"></script>
<link rel="stylesheet" href="/style.css?v=10">
</head>
<body>
<!-- 登录 / 注册 -->
<section id="v-auth" class="wrap hidden">
  <div class="brand"><div class="logo">聊</div><h1>HZZ 聊天室<span class="tagline">和朋友们轻松聊聊</span></h1></div>
  <div class="card">
    <div class="tabs"><button data-tab="login" class="on">登录</button><button data-tab="register">注册</button></div>
    <form id="f-auth" autocomplete="on">
      <label for="a-user">用户名</label>
      <input id="a-user" name="username" autocomplete="username" required maxlength="20" placeholder="3–20 位，中文 / 字母 / 数字 / 下划线">
      <label for="a-pass">密码</label>
      <input id="a-pass" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="至少 8 位">
      <div id="reg-extra" class="hidden">
        <label for="a-pass2">确认密码</label>
        <input id="a-pass2" type="password" autocomplete="new-password" maxlength="128" placeholder="再输入一次">
        <div id="code-wrap" class="hidden">
          <label for="a-code">注册口令</label>
          <input id="a-code" autocomplete="off" maxlength="64" placeholder="管理员已开启口令注册，请向管理员索取">
        </div>
      </div>
      <button class="btn block" id="a-submit" type="submit">登录</button>
      <div class="msg" id="a-msg"></div>
    </form>
  </div>
  <p class="sub foot"><a href="https://videochatroom.xyzhzz.com/">视频聊天室 →</a> · <button class="btn ghost sm theme-btn" data-theme-toggle type="button">🌙</button></p>
</section>

<!-- 改密 -->
<section id="v-chpw" class="wrap hidden">
  <div class="brand"><div class="logo">聊</div><h1>修改密码</h1></div>
  <div class="card">
    <p class="notice mt0">首次登录需要先修改初始密码。</p>
    <form id="f-chpw">
      <label>原密码</label><input id="c-old" type="password" autocomplete="current-password" required>
      <label>新密码</label><input id="c-new" type="password" autocomplete="new-password" required>
      <label>确认新密码</label><input id="c-new2" type="password" autocomplete="new-password" required>
      <button class="btn block" type="submit">确认修改</button>
      <button class="btn ghost block hidden" type="button" id="c-cancel">返回</button>
      <div class="msg" id="c-msg"></div>
    </form>
  </div>
</section>

<!-- 大厅 -->
<section id="v-lobby" class="hidden">
  <div class="top">
    <div class="who"><span id="l-av"></span><span class="hello-txt">你好，<b id="l-name"></b></span></div>
    <div class="row nogrow">
      <a id="l-admin" class="btn ghost sm hidden" href="/admin">管理后台</a>
      <a class="btn ghost sm" href="https://videochatroom.xyzhzz.com/">视频</a>
      <button class="btn ghost sm icon theme-btn" data-theme-toggle>🌙</button>
      <button class="btn ghost sm" id="l-avatar">头像</button>
      <button class="btn ghost sm" id="l-pw">改密码</button>
      <button class="btn ghost sm" id="l-logout">退出</button>
    </div>
  </div>
  <div class="wrap wide">
    <div class="grid2">
      <div class="card">
        <div class="tabs"><button data-rtab="join" class="on">加入私密房间</button><button data-rtab="create">创建房间</button></div>
        <form id="f-room" autocomplete="off">
          <div id="r-vis-wrap" class="hidden">
            <label>房间类型</label>
            <div class="seg">
              <label><input type="radio" name="r-vis" value="private" checked><span>🔒 私密<small>凭房间号 + 密码进入，不在大厅显示</small></span></label>
              <label><input type="radio" name="r-vis" value="public"><span>🌿 公开<small>显示在大厅，别人可申请加入</small></span></label>
            </div>
          </div>
          <label>房间号</label><input id="r-num" required maxlength="20" placeholder="3–20 位，字母 / 数字 / - / _" autocapitalize="off">
          <label id="r-pass-label">房间密码</label><input id="r-pass" type="password" maxlength="64" autocomplete="new-password" placeholder="4–64 位">
          <div id="r-create-extra" class="hidden"><label>房间名称（可选）</label><input id="r-name" maxlength="30" placeholder="例如：周末闲聊"></div>
          <button class="btn block" id="r-submit" type="submit">加入</button>
          <div class="msg" id="r-msg"></div>
        </form>
      </div>
      <div class="card">
        <h2>我的房间 <span class="count" id="l-rooms-n">0</span></h2>
        <ul class="list" id="l-rooms"></ul>
      </div>
    </div>
    <div class="card">
      <h2>🌿 公开房间 <span class="count" id="l-pub-n">0</span></h2>
      <div class="rooms" id="l-pub"></div>
    </div>
  </div>
</section>

<!-- 聊天 -->
<section id="v-chat" class="chat hidden">
  <div class="top">
    <button class="btn ghost sm" id="ch-back">‹ 大厅</button>
    <div class="center-col"><div class="title" id="ch-title"></div><div class="status" id="ch-status">连接中…</div></div>
    <div class="row nogrow">
      <button class="btn ghost sm hidden" id="rq-btn" title="加入申请">📨 <span class="badge-n hidden" id="rq-n">0</span></button>
      <button class="btn ghost sm" id="vc-toggle" title="语音频道">🎧 <span id="vc-count">0</span></button>
      <button class="btn ghost sm online-btn" id="ch-online-btn">👥 <span id="ch-count">0</span></button>
      <button class="btn ghost sm icon theme-btn" data-theme-toggle>🌙</button>
    </div>
  </div>
  <div class="voicebar" id="vc-bar">
    <div class="vc-head">
      <span class="vc-title">🎧 语音频道<small id="vc-cap"></small></span>
      <div class="row nogrow">
        <button class="btn sm ok" id="vc-join">加入语音</button>
        <button class="btn soft sm hidden" id="vc-mute">🎙️ 静音</button>
        <button class="btn danger sm hidden" id="vc-leave">离开语音</button>
      </div>
    </div>
    <div class="vc-people" id="vc-people"></div>
    <div class="vc-tip" id="vc-tip"></div>
  </div>
  <div class="chat-body">
    <div class="msgs" id="ch-msgs"></div>
    <aside class="side" id="ch-side"><h3>在线成员 · <span id="ch-count2">0</span></h3><ul class="list" id="ch-online"></ul></aside>
  </div>
  <form class="composer" id="f-send">
    <textarea id="ch-input" placeholder="输入消息，Enter 发送" maxlength="2000" rows="1"></textarea>
    <button class="btn" type="submit">发送</button>
  </form>
  <div class="card drawer hidden" id="rq-panel">
    <div class="row"><h2 class="mt0">加入申请</h2><button class="btn ghost sm nogrow" id="rq-close">关闭</button></div>
    <ul class="list" id="rq-list"></ul>
  </div>
</section>

<script src="/common.js?v=10"></script>
<script src="/app.js?v=10"></script>
</body>
</html>
